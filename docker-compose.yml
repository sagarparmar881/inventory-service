version: '4'
services:
  mysql:
    image: mysql:8.3.0
    container_name: inventory_service_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/mysql_inventory_service/init.sql:/docker-entrypoint-initdb.d/init.sql